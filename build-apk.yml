name: Build TODO APP (APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Optional: bundle the JS libraries so the app also works offline
      - name: Download libraries for offline use
        run: bash scripts/fetch-libs.sh

      - name: Build signed APK
        run: gradle --no-daemon assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk TODO-APP.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TODO-APP-apk
          path: TODO-APP.apk
          if-no-files-found: error
